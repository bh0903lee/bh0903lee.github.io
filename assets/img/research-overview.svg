<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="716" viewBox="0 0 1280 716" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A94A6"/>
    </marker>
    <style>
      .postech { fill:#EFEBF8; stroke:#6F5FA8; stroke-width:1.5; }
      .samsung { fill:#E4F3F0; stroke:#1F8A7A; stroke-width:1.5; }
      .etri    { fill:#E7EFF9; stroke:#3568A8; stroke-width:1.5; }
      .ongoing { stroke-dasharray:6 4; fill:#FAFBFD; }
      .conv    { fill:#FDF1E6; stroke:#D97A2B; stroke-width:1.8; stroke-dasharray:6 4; }
      .t { fill:#1F2933; font-size:15px; }
      .b { fill:#1F2933; font-size:15px; font-weight:600; }
      .s { fill:#52606D; font-size:13px; }
      .h { fill:#52606D; font-size:13px; font-weight:600; letter-spacing:.08em; }
      .arrow { stroke:#8A94A6; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    </style>
  </defs>
  <rect width="1280" height="716" fill="#ffffff"/>
  <text class="h" x="40" y="66">ORIGINS</text>
  <text class="h" x="384" y="66">RESEARCH THREADS</text>
  <text class="h" x="1000" y="66">CURRENT CONVERGENCE</text>

  <!-- row 1: healthcare AI -->
  <rect class="etri" x="40" y="90" width="300" height="120" rx="8"/>
  <text class="b" x="56" y="116">Healthcare AI</text>
  <text class="t" x="56" y="138">Vision, language and speech as</text>
  <text class="t" x="56" y="156">markers of neurocognitive disorders</text>
  <text class="s" x="56" y="178">AD, MCI · relational multimodal learning</text>
  <text class="s" x="56" y="196">ETRI, 2024–2026</text>
  <path class="arrow" d="M340,150 L380,150"/>
  <rect class="etri" x="384" y="90" width="280" height="120" rx="8"/>
  <text class="b" x="400" y="116">Multimodal cognitive assessment</text>
  <text class="t" x="400" y="138">Alzheimer's disease recognition</text>
  <text class="t" x="400" y="156">from image, text and audio</text>
  <text class="s" x="400" y="178">Sci. Rep. 2025 (×2) · granted KR patent</text>
  <text class="s" x="400" y="196">Further manuscript under review</text>
  <path class="arrow" d="M664,150 L704,150"/>
  <rect class="etri" x="708" y="90" width="250" height="120" rx="8"/>
  <text class="b" x="724" y="116">Korean MCI screening model</text>
  <text class="t" x="724" y="138">Primary developer; field</text>
  <text class="t" x="724" y="156">deployment and tech transfer</text>
  <text class="s" x="724" y="178">Tablet screening app, 2025</text>
  <text class="s" x="724" y="196">Transferred to two companies, 2026</text>
  <!-- row 2: bursty dynamics -> event sequences -->
  <rect class="postech" x="40" y="250" width="300" height="120" rx="8"/>
  <text class="b" x="56" y="276">Bursty dynamics</text>
  <text class="t" x="56" y="298">Generative models of correlated bursts</text>
  <text class="s" x="56" y="320">Physical Review E, 2018 and 2019</text>
  <text class="s" x="56" y="338">Correlated intervals, burst-size statistics</text>
  <text class="s" x="56" y="356">POSTECH, Ph.D. research</text>
  <path class="arrow" d="M340,310 L380,310"/>
  <rect class="etri" x="384" y="250" width="280" height="120" rx="8"/>
  <text class="b" x="400" y="276">Event-sequence learning</text>
  <text class="t" x="400" y="298">Burst and Memory-aware</text>
  <text class="t" x="400" y="316">Transformer</text>
  <text class="s" x="400" y="338">Frontiers Comput. Neurosci., 2023</text>
  <text class="s" x="400" y="356">Time-series pattern prediction patents</text>
  <path class="arrow" d="M664,310 L704,310"/>
  <rect class="etri ongoing" x="708" y="250" width="250" height="120" rx="8"/>
  <text class="b" x="724" y="276">Temporal point processes</text>
  <text class="t" x="724" y="298">Which temporal statistics a</text>
  <text class="t" x="724" y="316">sequence model needs</text>
  <text class="s" x="724" y="338">Ongoing · manuscripts under review</text>
  <!-- supporting: Samsung industrial ML -->
  <path class="arrow" d="M524,406 L524,374"/>
  <rect class="samsung" x="384" y="410" width="574" height="76" rx="8"/>
  <text class="b" x="400" y="432" font-size="14">Industrial machine learning · Samsung Research, 2019–2021</text>
  <text class="s" x="400" y="452">Demand and material-order forecasting evaluated through inventory simulation;</text>
  <text class="s" x="400" y="470">self-attention over user event sequences for advertising attribution</text>
  <!-- row 3: complex networks -> graph generation -->
  <rect class="postech" x="40" y="526" width="300" height="120" rx="8"/>
  <text class="b" x="56" y="552">Complex networks</text>
  <text class="t" x="56" y="574">Street networks of 22 Korean cities</text>
  <text class="s" x="56" y="596">Physica A, 2018</text>
  <text class="s" x="56" y="614">Centrality, planning regularity, scaling</text>
  <text class="s" x="56" y="632">POSTECH, Ph.D. research</text>
  <path class="arrow" d="M340,586 L380,586"/>
  <rect class="etri" x="384" y="526" width="280" height="120" rx="8"/>
  <text class="b" x="400" y="552">Graph learning</text>
  <text class="t" x="400" y="574">Network generation under</text>
  <text class="t" x="400" y="592">complex-network constraints</text>
  <text class="s" x="400" y="614">Granted Korean patent (first inventor)</text>
  <path class="arrow" d="M664,586 L704,586"/>
  <rect class="etri ongoing" x="708" y="526" width="250" height="120" rx="8"/>
  <text class="b" x="724" y="552">Constrained generation</text>
  <text class="t" x="724" y="574">Generating and editing graphs</text>
  <text class="t" x="724" y="592">under several constraints</text>
  <text class="s" x="724" y="614">Ongoing · manuscript under review</text>
  <!-- convergence -->
  <rect class="conv" x="1000" y="90" width="240" height="556" rx="10"/>
  <text class="b" x="1120" y="328" text-anchor="middle">AI for science</text>
  <text class="t" x="1120" y="352" text-anchor="middle">Science-specialized encoders</text>
  <text class="t" x="1120" y="370" text-anchor="middle">and tokenizers</text>
  <text class="t" x="1120" y="394" text-anchor="middle">Protein–ligand binding affinity</text>
  <text class="t" x="1120" y="412" text-anchor="middle">as the first application</text>
  <text class="s" x="1120" y="436" text-anchor="middle">ETRI, 2026–</text>
  <path class="arrow" d="M958,150 C980,150 986,368 996,368"/>
  <path class="arrow" d="M958,310 C980,310 986,368 996,368"/>
  <path class="arrow" d="M958,586 C980,586 986,368 996,368"/>
  <!-- legend -->
  <rect class="postech" x="40" y="686" width="26" height="16" rx="4"/><text class="s" x="74" y="699">POSTECH, Ph.D. (2012–2019)</text>
  <rect class="samsung" x="270" y="686" width="26" height="16" rx="4"/><text class="s" x="304" y="699">Samsung Research (2019–2021)</text>
  <rect class="etri" x="520" y="686" width="26" height="16" rx="4"/><text class="s" x="554" y="699">ETRI (2021–)</text>
  <rect class="conv" x="680" y="686" width="26" height="16" rx="4"/><text class="s" x="714" y="699">Current direction</text>
  <rect class="etri ongoing" x="860" y="686" width="26" height="16" rx="4"/><text class="s" x="894" y="699">Ongoing (under review or unpublished)</text>
</svg>