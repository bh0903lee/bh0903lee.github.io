<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.url == "/" %}
    {% assign page_title = "Byounghwa Lee | Senior Researcher, ETRI" %}
  {% else %}
    {% assign page_title = page.title | append: " · " | append: site.title | append: " | ETRI" %}
  {% endif %}
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <meta name="author" content="{{ site.author.name }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta property="og:type" content="{% if page.url == '/' %}profile{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">

  {% if page.url == "/" %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Byounghwa Lee",
    "alternateName": "Byoung-Hwa Lee",
    "jobTitle": "Senior Researcher",
    "affiliation": {
      "@type": "Organization",
      "name": "Electronics and Telecommunications Research Institute (ETRI)"
    },
    "alumniOf": {
      "@type": "CollegeOrUniversity",
      "name": "Pohang University of Science and Technology (POSTECH)"
    },
    "url": "{{ '/' | absolute_url }}",
    "email": "mailto:{{ site.author.email }}",
    "sameAs": [
{% for l in site.links %}      "{{ l.url }}"{% unless forloop.last %},{% endunless %}
{% endfor %}    ]
  }
  </script>
  {% endif %}
</head>
