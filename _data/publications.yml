- key: P01
  title: "Multimodal Alzheimer's disease recognition from image, text and audio"
  authors:
    - Byounghwa Lee
    - Hwa Jeon Song
    - Young-Jin Park
    - Byung Ok Kang
  venue: Scientific Reports
  type: journal
  year: 2025
  date: 2025-08-08
  doi: 10.1038/s41598-025-14998-7
  role: First and corresponding author
  summary: >-
    Builds an image-sentence bipartite graph with a vision-language model and
    fuses the resulting GCN representation with text and speech encoders
    through co-attention, then analyses each modality's contribution.
  finding: >-
    On the ADReSSo benchmark, fusing the graph with text and audio through
    co-attention improved mean accuracy over the graph alone; most of the
    gain came from co-attention across modalities, and adding audio was not
    beneficial in every configuration. Results are for an English
    picture-description benchmark, not a clinical validation.

- key: P02
  title: "Alzheimer's disease recognition using graph neural network by leveraging image-text similarity from vision language model"
  authors:
    - Byounghwa Lee
    - Jeong-Uk Bang
    - Hwa Jeon Song
    - Byung Ok Kang
  venue: Scientific Reports
  type: journal
  year: 2025
  date: 2025-01-06
  doi: 10.1038/s41598-024-82597-z
  role: First and corresponding author
  summary: >-
    Represents picture regions and spoken sentences in a shared vision-language
    space and classifies participants from the similarity-weighted bipartite
    graph, with ablations on the relational structure.
  finding: >-
    On the ADReSSo benchmark, the graph built from image-text similarity
    supported Alzheimer's disease classification on its own, and removing
    the image-text relations lowered mean accuracy, indicating that the
    relational structure itself carries diagnostic signal.

- key: P03
  title: "Burst and Memory-aware Transformer: capturing temporal heterogeneity"
  authors:
    - Byounghwa Lee
    - Jung-Hoon Lee
    - Sungyup Lee
    - Cheol Ho Kim
  venue: Frontiers in Computational Neuroscience
  type: journal
  year: 2023
  date: 2023-12-12
  doi: 10.3389/fncom.2023.1292842
  role: First and corresponding author
  summary: >-
    Embeds burstiness and memory statistics into a Transformer temporal point
    process and tests where explicit temporal heterogeneity helps next-event
    time prediction.
  finding: >-
    Burst and memory statistics improved next-event time prediction mainly
    where temporal heterogeneity was strong; against a matched ablation the
    gain held on all but one of the real-world datasets.

- key: P04
  title: "Latent-Variable Classifiers Based on Total Correlation for Dynamic Environments"
  authors:
    - Cheol Ho Kim
    - Byounghwa Lee
    - Jung-Hoon Lee
    - Ock Kee Baek
  venue: "International Conference on Information and Communication Technology Convergence (ICTC)"
  type: conference
  year: 2023
  date: 2023-10-11
  doi: 10.1109/ICTC58733.2023.10393699
  role: Co-author
  summary: >-
    Couples total-correlation latent variables with existing classifiers so
    that models can absorb newly arriving features without revisiting past raw
    data.

