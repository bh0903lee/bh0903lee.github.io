- key: P07
  title: "Copula-based algorithm for generating bursty time series"
  authors:
    - Hang-Hyun Jo
    - Byoung-Hwa Lee
    - Takayuki Hiraoka
    - Woo-Sung Jung
  venue: Physical Review E
  type: journal
  year: 2019
  date: 2019-08-14
  doi: 10.1103/PhysRevE.100.022307
  role: Co-author
  summary: >-
    Uses a Farlie-Gumbel-Morgenstern copula to generate event sequences with a
    prescribed inter-event time distribution and a prescribed memory
    coefficient within the correlation range allowed by the construction.

- key: P08
  title: "Hierarchical burst model for complex bursty dynamics"
  authors:
    - Byoung-Hwa Lee
    - Woo-Sung Jung
    - Hang-Hyun Jo
  venue: Physical Review E
  type: journal
  year: 2018
  date: 2018-08-17
  doi: 10.1103/PhysRevE.98.022316
  role: First author
  summary: >-
    Proposes a hierarchical generative model in which one mechanism accounts
    for the inter-event time distribution, the autocorrelation and the burst
    size distribution at once.
  finding: >-
    The relation between the inter-event time exponent and the
    autocorrelation exponent (alpha + gamma = 2) still holds when successive
    intervals are correlated, and burst sizes follow a stretched-exponential
    rather than a power-law distribution.

- key: P09
  title: "Analysis on the urban street network of Korea: Connections between topology and meta-information"
  authors:
    - Byoung-Hwa Lee
    - Woo-Sung Jung
  venue: "Physica A: Statistical Mechanics and its Applications"
  type: journal
  year: 2018
  date: 2018-05-01
  doi: 10.1016/j.physa.2017.12.131
  role: First author
  summary: >-
    Analyses the street networks of 22 Korean cities through centrality
    measures, planning regularity and population-road length scaling, and
    relates the structural groups to urban meta-information.
  finding: >-
    Cities grouped by the inequality of their centrality measures shared
    demographic and planning characteristics, and population-road-length
    scaling differed between urban and urban-rural cities.
