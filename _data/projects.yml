# Research areas and industrial applications, described through personal
# contributions rather than formal program titles or internal identifiers.

- name: Scientific representation learning
  org: ETRI
  period: "Jan 2026 - present"
  my_period: "Jan 2026 - present"
  role: Encoder and tokenizer development, model evaluation
  current: true
  description: >-
    Science-specific encoders and tokenizers are the focus of my current work,
    with applications to drug discovery. I build model inputs, combine
    sequence representations with 3D interaction features for protein–ligand
    binding-affinity prediction, and evaluate models under similarity-controlled
    data splits. Checks on measurement types and units keep the data and
    evaluation conditions consistent.

- name: Speech and multimodal learning for cognitive assessment
  org: ETRI
  period: "Jan 2024 - Aug 2026"
  my_period: "Jan 2024 - Aug 2026"
  role: Cognitive modelling, field deployment and model integration
  description: >-
    This work combined research on Alzheimer's disease classification from
    picture-description speech with applied development for mild cognitive
    impairment assessment. My contributions included graph-based and multimodal
    methods, a Korean speech-based classification model, and model integration
    for an interactive cognitive assessment system.

- name: Event-sequence learning and collaborative machine learning
  org: ETRI
  period: "Aug 2021 - Dec 2023"
  my_period: "Aug 2021 - Dec 2023"
  role: Temporal modelling, model development and analysis
  description: >-
    I developed burst- and memory-aware temporal point-process models and
    contributed to classifiers for dynamic environments. Clinical collaborations
    involved model development and analysis with domain specialists, including
    work on treatment-choice interpretation using clinical and socioeconomic
    data.

- name: Industrial machine learning at Samsung Research
  org: "Samsung Electronics, Samsung Research (Global AI Center)"
  period: "Mar 2019 - Jul 2021"
  my_period: "Mar 2019 - Jul 2021"
  role: Staff Engineer
  description: >-
    At Samsung Research, I developed demand and material-order forecasting models,
    evaluating order predictions through inventory simulations that accounted
    for overstock and shortages. In advertising and recommendation, I led
    development of a self-attention model for
    multi-touch advertising attribution, and designed a self-supervised
    architecture for cross-domain recommendation.
