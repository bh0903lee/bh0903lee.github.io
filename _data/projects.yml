# Research programs and industrial projects. Described at the level of role and
# technical contribution; budgets and internal project numbers are not listed.

- name: "AI for Science - ETRI Strategic Research Program"
  org: ETRI
  period: "2026 - present"
  my_period: "Jan 2026 - present"
  role: >-
    Sequence encoders and tokenizers for scientific data; protein-ligand
    representation learning
  current: true
  description: >-
    A strategic program on foundation models for scientific domains, running
    2026-2030 with ETRI as the lead institution. I work on sequence encoders
    and tokenizers designed for scientific data rather than natural language.
    Protein-ligand representation and binding models (NewDrug) are carried out
    within the same program as the empirical case for that work, together with
    the data splitting and evaluation pipeline used to assess it. I also took
    part in planning the follow-on program.

- name: "AI-based assessment of degenerative brain function decline from everyday speech"
  org: "National Research Council of Science & Technology (NST), Creative Convergence Research Program"
  period: "Sep 2021 - Aug 2026"
  my_period: "Jan 2024 - Aug 2026"
  role: "Cognitive function analysis and assessment (ETRI subproject)"
  description: >-
    A five-institution program on assessing cognitive decline from everyday
    speech. In the ETRI subproject on speech recognition, cognitive function
    analysis and conversational training, I developed the Korean speech-based
    MCI classification model, ran it in field deployment, and built the
    multimodal recognition methods published in Scientific Reports.

- name: "Autonomous growth complex AI core technology"
  org: "ETRI Basic Research Program (Ministry of Science and ICT)"
  period: "2020 - 2025"
  my_period: "Aug 2021 - Dec 2023"
  role: Event-sequence learning and applied ML collaborations
  description: >-
    Core-technology program on self-adaptive AI. I worked on burst- and
    memory-aware temporal point processes, contributed to latent-variable
    classifiers for dynamic environments, and took part in clinical
    collaborations with Ajou University Hospital, EvidNet and Seoul National
    University Hospital.

- name: Industrial machine learning at Samsung Research
  org: "Samsung Electronics, Samsung Research (Global AI Center)"
  period: "Mar 2019 - Jul 2021"
  my_period: "Mar 2019 - Jul 2021"
  role: Staff Engineer
  description: >-
    Three lines of applied work: demand and inventory optimisation with
    simulation-based evaluation; a self-attention multi-touch advertising
    attribution model, which I led; and a self-supervised architecture for
    cross-domain recommendation.
