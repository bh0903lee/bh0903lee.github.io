# Research areas and industrial applications, described through personal
# contributions rather than formal program titles or internal identifiers.

- name: Scientific representations and protein–ligand modelling
  org: ETRI
  period: "2026 - present"
  my_period: "2026 - present"
  role: Scientific sequence encoding, interaction modelling and evaluation
  current: true
  description: >-
    I develop sequence encoders for scientific data and protein–ligand
    binding-affinity models using pretrained representations and 3D interaction
    features. My work includes checking measurement types and units, constructing
    model inputs, and evaluating under protein and ligand similarity controls.
    These studies examine how representation choices and data conditions affect
    predictive performance.

- name: Speech and multimodal learning for cognitive assessment
  org: ETRI
  period: "Jan 2024 - Aug 2026"
  my_period: "Jan 2024 - Aug 2026"
  role: Cognitive modelling, field deployment and model integration
  description: >-
    I developed graph-based and multimodal methods for Alzheimer's disease
    classification from picture-description speech. In applied work, I developed
    a Korean speech-based model for mild cognitive impairment as its primary
    developer and contributed to field deployment and technology transfer. I also
    worked on real-time speech processing, session handling and server
    integration for an interactive assessment system.

- name: Event-sequence learning and collaborative machine learning
  org: ETRI
  period: "Aug 2021 - Dec 2023"
  my_period: "Aug 2021 - Dec 2023"
  role: Temporal modelling, model development and analysis
  description: >-
    I developed burst- and memory-aware temporal point-process models and
    contributed to classifiers for dynamic environments. Clinical collaborations
    involved model development and analysis with domain specialists, including
    work on treatment-choice interpretation using clinical and socioeconomic
    data.

- name: Industrial machine learning at Samsung Research
  org: "Samsung Electronics, Samsung Research (Global AI Center)"
  period: "Mar 2019 - Jul 2021"
  my_period: "Mar 2019 - Jul 2021"
  role: Staff Engineer
  description: >-
    I developed demand and material-order forecasting models and evaluated
    order predictions through inventory simulations, including overstock and
    shortages. I led development of a self-attention model for
    multi-touch advertising attribution, and designed a self-supervised
    architecture for cross-domain recommendation. The work addressed temporal
    demand patterns, sequences of advertising interactions, and user behaviour
    across domains.
